name: Check publication metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-bibliography.py
      - uses: actions/upload-artifact@v4
        with:
          name: bibliography-report
          path: bibliography-report.json
